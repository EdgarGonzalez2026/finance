<!DOCTYPE html>
<html lang="es-PY">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f4f7f5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="FINANCE">
  <title>FINANCE</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <div class="brand-mark" aria-hidden="true">F</div>
      <h1>FINANCE</h1>
    </header>

    <section class="balance-card" aria-labelledby="balance-label">
      <p id="balance-label">Saldo disponible</p>
      <strong id="balance">Gs. 0</strong>
      <div class="summary-grid">
        <div>
          <span class="summary-label"><i class="dot dot-income"></i>Ingresos</span>
          <strong id="income-total">Gs. 0</strong>
        </div>
        <div>
          <span class="summary-label"><i class="dot dot-expense"></i>Gastos</span>
          <strong id="expense-total">Gs. 0</strong>
        </div>
      </div>
    </section>

    <button class="primary-button" id="new-movement-button" type="button">
      <span aria-hidden="true">+</span> Nuevo movimiento
    </button>

    <section class="movements-section" aria-labelledby="movements-title">
      <div class="section-heading">
        <div>
          <p class="eyebrow">ACTIVIDAD</p>
          <h2 id="movements-title">Últimos movimientos</h2>
        </div>
        <span id="movement-count" class="count-badge" aria-label="Cantidad de movimientos">0</span>
      </div>
      <div id="movements-list" class="movements-list" aria-live="polite"></div>
    </section>
  </main>

  <div class="modal" id="movement-modal" hidden>
    <div class="modal-backdrop" data-close-modal></div>
    <section class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-handle" aria-hidden="true"></div>
      <div class="modal-header">
        <div>
          <p class="eyebrow">REGISTRO</p>
          <h2 id="modal-title">Nuevo movimiento</h2>
        </div>
        <button class="icon-button" type="button" data-close-modal aria-label="Cerrar formulario">&times;</button>
      </div>

      <form id="movement-form" novalidate>
        <fieldset class="type-selector">
          <legend>Tipo</legend>
          <div class="segmented-control">
            <label><input type="radio" name="type" value="gasto" checked><span>Gasto</span></label>
            <label><input type="radio" name="type" value="ingreso"><span>Ingreso</span></label>
          </div>
        </fieldset>

        <label class="field">
          <span>Monto</span>
          <div class="amount-input"><span>Gs.</span><input id="amount" name="amount" type="number" inputmode="numeric" min="1" step="1" placeholder="25.000" required></div>
        </label>

        <label class="field">
          <span>Categoría</span>
          <select id="category" name="category" required></select>
        </label>

        <label class="field">
          <span>Descripción <small>Opcional</small></span>
          <input id="description" name="description" type="text" maxlength="80" placeholder="Ej. Almuerzo">
        </label>

        <label class="field">
          <span>Fecha</span>
          <input id="date" name="date" type="date" required>
        </label>

        <p id="form-error" class="form-error" role="alert" hidden></p>
        <button class="primary-button submit-button" type="submit">Guardar movimiento</button>
      </form>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
